<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.35; transform: scaleX(0.92); }
      50% { opacity: 0.9; transform: scaleX(1); }
    }
    @keyframes radialDrift {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -52%) scale(1.08); }
    }
    .pulse-glow {
      animation: radialDrift 7s ease-in-out infinite;
    }
    .load-track {
      animation: subtlePulse 2.4s ease-in-out infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-0 select-none">
<!-- Mobile Portrait Container (390px x 844px) -->
<main class="relative w-full max-w-[390px] h-[844px] overflow-hidden flex flex-col justify-between shadow-2xl bg-gradient-to-b from-[#064B3F] via-[#085C4D] to-[#0B6E5C]">
<!-- Ambient Geometric Radiance and Tech Grid Lines -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<!-- Primary Core Ambient Radial Center Glow -->
<div class="pulse-glow absolute top-1/2 left-1/2 w-[360px] h-[360px] rounded-full bg-primary-fixed-dim/20 blur-[85px]"></div>
<!-- Secondary Upper Accent Glow -->
<div class="absolute -top-16 -right-16 w-64 h-64 rounded-full bg-[#135346]/40 blur-[70px]"></div>
<!-- Subtle Golden Ray Highlight in Top Corner -->
<div class="absolute top-28 -left-20 w-48 h-48 rounded-full bg-secondary-fixed/10 blur-[60px]"></div>
<!-- Precision Optical Grid Watermark (Refined Fintech Structure) -->
<div class="absolute inset-0 opacity-[0.035]" style="background-image: linear-gradient(to right, #ffffff 1px, transparent 1px), linear-gradient(to bottom, #ffffff 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Top Status Bar Area / Cellular & Hardware Safe Area -->
<header class="relative z-10 w-full pt-3 px-6 flex justify-between items-center text-primary-fixed/80">
<span class="font-body-sm text-body-sm font-semibold tracking-tight text-on-tertiary">09:41</span>
<div class="flex items-center gap-1.5 text-on-tertiary">
<span class="material-symbols-outlined text-[16px]" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]" data-icon="wifi">wifi</span>
<span class="material-symbols-outlined text-[18px]" data-icon="battery_full">battery_full</span>
</div>
</header>
<!-- Center Hero Identity Section -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-gutter text-center -mt-6">
<!-- Brand Logo Mark with Gold Accent & Layered Depth -->
<div class="relative mb-6 group">
<!-- Ambient outer halo -->
<div class="absolute -inset-2 bg-primary-fixed/20 rounded-[28px] blur-md"></div>
<!-- Premium Glassmorphic Tile Enclosure -->
<div class="relative w-24 h-24 rounded-[24px] bg-gradient-to-br from-white/15 to-white/5 border border-white/20 shadow-[0_12px_32px_rgba(0,0,0,0.22)] backdrop-blur-md flex items-center justify-center">
<!-- Box/Package Stylized Icon -->
<span class="material-symbols-outlined text-on-primary text-[46px]" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<!-- Modern Minimalist Gold Sparkle Badge (#F2B84B) -->
<div class="absolute -top-1.5 -right-1.5 w-7 h-7 rounded-full bg-[#064B3F] border-2 border-[#0B6E5C] flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[#F2B84B] text-[18px]" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<!-- Micro Optical Accent Bar at bottom of card -->
<div class="absolute bottom-2.5 w-8 h-1 rounded-full bg-primary-fixed-dim/60"></div>
</div>
</div>
<!-- App Title in Crisp White Plus Jakarta Sans -->
<h1 class="font-headline-lg text-headline-lg font-bold tracking-tight text-on-primary flex items-center justify-center gap-1.5 drop-shadow-sm">
        StockPilot <span class="text-primary-fixed font-headline-lg text-headline-lg">AI</span>
</h1>
<!-- Subtitle / Tagline in Emerald Soft Tint -->
<p class="font-body-md text-body-md text-[#E6F4F1] mt-2.5 max-w-[260px] leading-relaxed font-normal opacity-95">
        Smart POS &amp; Retail Engine for Shopkeepers
      </p>
<!-- Institutional Readiness Chip (Subtle Trust Factor) -->
<div class="mt-5 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 border border-white/15 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary-fixed text-[14px]" data-icon="offline_pin">offline_pin</span>
<span class="font-label-sm text-label-sm text-primary-fixed tracking-wide">ZERO DOWNTIME SYNC</span>
</div>
</div>

<div class="w-28 h-1 bg-white/15 rounded-full overflow-hidden relative">
<div class="load-track absolute inset-0 w-full h-full bg-gradient-to-r from-primary-fixed-dim via-on-tertiary to-primary-fixed rounded-full shadow-[0_0_8px_#83d6c0]"></div>
</div>
<!-- Pakistani Retailers Anchor with Green Heart Dot -->

<span class="w-2 h-2 rounded-full bg-[#12B76A] ring-4 ring-[#12B76A]/20"></span>
<span class="font-body-sm text-body-sm font-medium tracking-tight">
          Made for Pakistani Retailers
        </span>
</div>
<!-- Edition & Version Details -->
<div class="flex items-center gap-2 text-primary-fixed-dim/75 font-label-sm text-label-sm">
<span>Version 2.4.0</span>
<span class="text-white/30">•</span>
<span>Offline-First Edition</span>
</div>
<!-- Android Home Bar Safe Indicator -->
<div class="w-32 h-1 bg-white/20 rounded-full mt-2"></div>
</footer>
