services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: skillconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillconnect
      POSTGRES_PASSWORD: skillconnect_dev_password
      POSTGRES_DB: skillconnect
    ports:
      - "5432:5432"
    volumes:
      - skillconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillconnect -d skillconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skillconnect_pgdata:
